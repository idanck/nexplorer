org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# versionName של האפליקציה. versionCode נגזר ממספר הריצה ב-CI (מונוטוני).
APP_VERSION_NAME=0.1.0

# OneDrive (שלב 6): ה-Application (client) ID של רישום האפליקציה ב-Microsoft Entra ("Personal Microsoft accounts only",
# החזרה ל-com.idanck.nexplorer://oauth). לא סוד — הוא בכל APK. ריק — האריח של OneDrive מסביר שהוא עוד לא מוגדר.
nexplorer.microsoftClientId=
