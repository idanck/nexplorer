version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    labels: ["deps"]
    commit-message: { prefix: "chore(deps)" }
    # כל PR מריץ QA על שני אמולטורים (~75 דקות): minor ו-patch יחד ב-PR אחד; major — כל אחד לבד.
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Compose 1.12 (BOM 2026.08 ומעלה): ה-monkey ב-API 30 נתקע על ANR — אירועי trackball בזמן שדיאלוג או Popup
      # נפתחים ונסגרים (2 מ-2 נכשלו; עם 1.10 ‏4 מ-4 עברו, PR #34). עד שזה ייחקר.
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2026.08.00"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    labels: ["deps"]
    commit-message: { prefix: "chore(ci)" }
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
