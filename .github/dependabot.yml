version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    labels: ["deps"]
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    labels: ["deps"]
    commit-message: { prefix: "chore(ci)" }
