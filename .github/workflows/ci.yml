name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build
        run: |
          if [ ! -f gradlew ]; then echo "no gradle wrapper yet — skipped"; exit 0; fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
